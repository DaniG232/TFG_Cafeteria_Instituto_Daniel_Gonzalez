<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Plato - Cocina</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina">
    <nav class="nav">
        <div class="nav-contenido">
            <div class="flex items-center gap-3">
                <a th:href="@{/}" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img th:src="@{/imagenes/logo.png}" alt="La Pausa"
                        style="width:48px; height:48px; margin-left: 10px"
                        class="object-contain" />
                    <span class="font-bold text-gray-900 text-lg">
                        La Pausa
                    </span>
                </a>
                <span class="text-gray-300">|</span>
                <span class="nav-enlace-activo">Platos</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a th:href="@{/cocinero/inicio}" class="nav-enlace">Inicio</a>
                <a th:href="@{/cocinero/platos}" class="nav-enlace-activo">Platos</a>
                <a th:href="@{/cocinero/menus}" class="nav-enlace">Menús</a>
                <a th:href="@{/cocinero/reservas}" class="nav-enlace">Reservas</a>
                <a th:href="@{/cocinero/encuestas}" class="nav-enlace">Encuestas</a>
            </div>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/notificaciones :: panel}"></div>
                <span class="nav-saludo">¡Hola, <span class="nav-usuario" th:text="${nombreUsuario}">Cocinero</span>!</span>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="btn-secondary btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="contenido-principal">
        <div class="max-w-xl mx-auto">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-titulo">Crear Nuevo Plato</h2>
                </div>
                <div class="card-cuerpo">
                    <form th:action="@{/cocinero/platos/nuevo}" method="post">
                        <div class="form-grupo">
                            <label for="nombre" class="form-label">Nombre del plato</label>
                            <input type="text" id="nombre" name="nombre" class="form-input" required>
                        </div>
                        <div class="form-grupo">
                            <label for="tipo" class="form-label">Tipo</label>
                            <select id="tipo" name="tipo" class="form-input" required>
                                <option value="PRIMERO">PRIMERO</option>
                                <option value="SEGUNDO">SEGUNDO</option>
                                <option value="POSTRE">POSTRE</option>
                                <option value="BEBIDA">BEBIDA</option>
                            </select>
                        </div>
                        <div class="form-grupo">
                            <label for="precio" class="form-label">Precio individual (€)</label>
                            <input type="number" step="0.01" id="precio" name="precio" class="form-input" required>
                        </div>
                        <div class="form-grupo">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <textarea id="descripcion" name="descripcion" class="form-input"></textarea>
                        </div>
                        <div class="mt-6 flex space-x-3">
                            <button type="submit" class="btn-primary">Guardar Plato</button>
                            <a th:href="@{/cocinero/platos}" class="btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
</body>
</html>
