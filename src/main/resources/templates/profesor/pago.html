<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8" />
    <title>Pago del Menú</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}" />
    <style>
        .hidden { display: none; }
        .card { max-width: 600px; margin: auto; padding: 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; }
    </style>    
</head>
<body class="pagina">
    <div class="card max-w-3xl mx-auto">

    <!-- Header -->
    <div class="card-header">
        <div>
            <h2 class="card-titulo"
                th:text="'Pagar Menú del ' + ${menu.fecha}">
            </h2>

            <p class="subtitulo-seccion mb-0">
                Selecciona el método de pago para confirmar la reserva
            </p>
        </div>
    </div>

    <!-- Contenido -->
    <div class="card-cuerpo">

        <!-- Resumen menú -->
        <div class="space-y-3 mb-6">

            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <span class="text-gray-500 text-sm">Primer plato</span>
                <span class="font-medium text-gray-900"
                      th:text="${menu.primerPlato.nombre}">
                </span>
            </div>

            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <span class="text-gray-500 text-sm">Segundo plato</span>
                <span class="font-medium text-gray-900"
                      th:text="${menu.segundoPlato.nombre}">
                </span>
            </div>

            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <span class="text-gray-500 text-sm">Postre</span>
                <span class="font-medium text-gray-900"
                      th:text="${menu.postre.nombre}">
                </span>
            </div>

            <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                <span class="text-gray-500 text-sm">Bebida</span>
                <span class="font-medium text-gray-900"
                      th:text="${menu.bebida.nombre}">
                </span>
            </div>

        </div>

        <!-- Precio -->
        <div class="bg-[#F0FDF9] border border-[#CCFBF1] rounded-xl p-4 mb-8">
            <div class="flex items-center justify-between">
                <span class="text-sm font-medium text-[#0F766E]">
                    Total a pagar
                </span>

                <span class="text-2xl font-bold text-[#0F766E]"
                      th:text="${menu.precio + ' €'}">
                </span>
            </div>
        </div>

        <!-- Formulario -->
        <form th:action="@{/profesor/reservas/nueva}" method="post">

            <input type="hidden"
                   name="idMenu"
                   th:value="${menu.idMenu}" />

            <!-- Métodos de pago -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">

                <!-- Tarjeta -->
                <label class="block cursor-pointer">
                    <input type="radio"
                           name="metodoPago"
                           value="TARJETA"
                           class="metodo-pago-input"
                           onchange="toggleTarjeta()" />

                    <div class="metodo-pago-card">
                        <div class="flex items-center justify-between">
                            <span class="metodo-pago-titulo">
                                <span>💳</span> Tarjeta
                            </span>
                        </div>

                        <p class="metodo-pago-desc">
                            Pago online
                        </p>
                    </div>
                </label>

                <!-- Bizum -->
                <label class="block cursor-pointer">
                    <input type="radio"
                           name="metodoPago"
                           value="BIZUM"
                           class="metodo-pago-input"
                           onchange="toggleTarjeta()" />

                    <div class="metodo-pago-card">
                        <div class="flex items-center justify-between">
                            <span class="metodo-pago-titulo">
                                <span>📱</span> Bizum
                            </span>
                        </div>

                        <p class="metodo-pago-desc">
                            Pago online
                        </p>
                    </div>
                </label>

                <!-- Caja -->
                <label class="block cursor-pointer">
                    <input type="radio"
                           name="metodoPago"
                           value="CAJA"
                           class="metodo-pago-input"
                           onchange="toggleTarjeta()" />

                    <div class="metodo-pago-card">
                        <div class="flex items-center justify-between">
                            <span class="metodo-pago-titulo">
                                <span>🏧</span> En caja
                            </span>
                        </div>

                        <p class="metodo-pago-desc">
                            Al recoger
                        </p>
                    </div>
                </label>

            </div>
            
            <!-- Subformulario Tarjeta -->
            <div id="form-tarjeta" class="subformulario-pago hidden">
                <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Datos de la Tarjeta</h4>
                <div class="form-grupo">
                    <label for="numeroTarjeta" class="form-label">Número de tarjeta</label>
                    <input type="text" id="numeroTarjeta" name="numeroTarjeta" placeholder="1234 5678 9012 3456" maxlength="16" pattern="\d{16}" class="form-input" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="form-grupo mb-0">
                        <label for="caducidad" class="form-label">Caducidad (MM/AA)</label>
                        <input type="text" id="caducidad" name="caducidad" placeholder="MM/AA" maxlength="5" pattern="(0[1-9]|1[0-2])/[0-9]{2}" class="form-input" oninput="this.value = this.value.replace(/[^0-9\\/]/g, '')" />
                    </div>
                    <div class="form-grupo mb-0">
                        <label for="cvv" class="form-label">CVV</label>
                        <input type="text" id="cvv" name="cvv" placeholder="123" maxlength="3" pattern="\d{3}" class="form-input" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
                    </div>
                </div>
            </div>
            
            <!-- Subformulario Bizum -->
            <div id="form-bizum" class="subformulario-pago hidden">
                <h4 class="text-xs font-semibold text-gray-500 uppercase tracking-wider mb-4">Datos de Bizum</h4>
                <div class="form-grupo mb-0">
                    <label for="telefono" class="form-label">Número de teléfono</label>
                    <input type="text" id="telefono" name="telefono" placeholder="6XX XXX XXX" maxlength="9" pattern="\d{9}" class="form-input" oninput="this.value = this.value.replace(/[^0-9]/g, '')" />
                </div>
            </div>
            
            <!-- Info En Caja -->
            <div id="info-caja" class="p-4 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl mb-6 hidden flex gap-2 items-center">
                <span>ℹ️</span> <span>Pagarás cuando vayas a recoger tu pedido en la Cafetería.</span>
            </div>

            <div class="mt-6 flex space-x-3">
                <button id="btn-reservar" type="submit" class="btn-primary btn-sm mt-4">Confirmar reserva</button>
                <a th:href="@{/profesor/menus}" class="btn-secondary btn-sm mt-4">Cancelar</a>
            </div>
        </form>
    </div>
    </div>
    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
    <script>
        // Elementos
        const formTarjeta = document.getElementById('form-tarjeta');
        const formBizum = document.getElementById('form-bizum');
        const infoCaja = document.getElementById('info-caja');
        const btnReservar = document.getElementById('btn-reservar');

        const radiosPago = document.querySelectorAll('input[name="metodoPago"]');

        // Función para actualizar la vista
        function actualizarMetodoPago() {
            const metodoSeleccionado = document.querySelector('input[name="metodoPago"]:checked').value;

            // Ocultar todos
            formTarjeta.classList.add('hidden');
            formBizum.classList.add('hidden');
            infoCaja.classList.add('hidden');

            // Mostrar el correspondiente
            if (metodoSeleccionado === 'TARJETA') {
                formTarjeta.classList.remove('hidden');
                btnReservar.textContent = 'Pagar y reservar';

            } else if (metodoSeleccionado === 'BIZUM') {
                formBizum.classList.remove('hidden');
                btnReservar.textContent = 'Pagar y reservar';

            } else if (metodoSeleccionado === 'CAJA') {
                infoCaja.classList.remove('hidden');
                btnReservar.textContent = 'Confirmar reserva';
            }
        }

        // Eventos radios
        radiosPago.forEach(radio => {
            radio.addEventListener('change', actualizarMetodoPago);
        });

        // Ejecutar al cargar la página
        actualizarMetodoPago();

        // Autoformateo MM/AA
        const caducidadInput = document.getElementById('caducidad');

        if (caducidadInput) {
            caducidadInput.addEventListener('input', function (e) {

                let value = e.target.value.replace(/\D/g, '');

                if (value.length > 4) {
                    value = value.substring(0, 4);
                }

                if (value.length >= 3) {
                    value = value.substring(0, 2) + '/' + value.substring(2);
                }

                e.target.value = value;
            });
        }
    </script>
</body>
</html>
