<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Usuario - Panel de Administración</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina">
    <nav class="nav">
        <div class="nav-contenido">
            <div class="flex items-center gap-3">
                <a th:href="@{/}" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img th:src="@{/imagenes/logo.png}" alt="La Pausa"
                        style="width:48px; height:48px; margin-left: 10px"
                        class="object-contain" />
                    <span class="font-bold text-gray-900 text-lg">
                        La Pausa
                    </span>
                </a>
                <span class="text-gray-300">|</span>
                <span class="nav-enlace-activo">Usuarios</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a th:href="@{/admin/inicio}" class="nav-enlace">Inicio</a>
                <a th:href="@{/admin/usuarios}" class="nav-enlace-activo">Usuarios</a>
                <a th:href="@{/admin/menus}" class="nav-enlace">Menús</a>
                <a th:href="@{/admin/reservas}" class="nav-enlace">Reservas</a>
                <a th:href="@{/admin/encuestas}" class="nav-enlace">Encuestas</a>
                <a th:href="@{/admin/avisos}" class="nav-enlace">Avisos</a>
            </div>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/notificaciones :: panel}"></div>
                <span class="nav-saludo">¡Hola, <span class="nav-usuario" th:text="${nombreUsuario}">Admin</span>!</span>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="btn-secondary btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="contenido-principal">
        <div class="max-w-xl mx-auto">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-titulo">Añadir Nuevo Usuario</h2>
                </div>
                
                <div class="card-cuerpo">
                    <div th:if="${error}" class="alerta-error" th:text="${error}"></div>
                    
                    <form th:action="@{/admin/usuarios/nuevo}" method="post">
                        <div class="form-grupo">
                            <label for="nombre" class="form-label">Nombre completo</label>
                            <input type="text" id="nombre" name="nombre" class="form-input" required>
                        </div>
                        <div class="form-grupo">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-input" required>
                        </div>
                        <div class="form-grupo">
                            <label for="contrasena" class="form-label">Contraseña</label>
                            <input type="password" id="contrasena" name="contrasena" class="form-input" required>
                        </div>
                        <div class="form-grupo">
                            <label for="rol" class="form-label">Rol</label>
                            <select id="rol" name="rol" class="form-input" required>
                                <option value="PROFESOR">PROFESOR</option>
                                <option value="COCINERO">COCINERO</option>
                                <option value="ADMIN">ADMIN</option>
                            </select>
                        </div>
                        
                        <div class="flex space-x-3 mt-8 border-t border-gray-200 pt-6">
                            <button type="submit" class="btn-primary">Guardar Usuario</button>
                            <a th:href="@{/admin/usuarios}" class="btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
</body>
</html>
