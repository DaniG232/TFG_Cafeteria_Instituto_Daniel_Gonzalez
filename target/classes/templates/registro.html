<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Cafetería Instituto</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="login-pagina">
    <div class="login-card">
        <!-- Logo y nombre -->
        <div class="flex flex-col items-center mb-8">
            <img th:src="@{/imagenes/logo.png}"
                 alt="La Pausa"
                 style="width:240px; height:240px;"
                 class="object-contain mb-3">
            <h1 class="text-2xl font-bold text-[#0F766E]">La Pausa</h1>
            <p class="text-sm text-gray-400 mt-1">Cafetería del Instituto</p>
        </div>
        <h2 class="login-titulo">Registro de Profesor</h2>
        <p class="text-sm text-gray-500 text-center mb-8">
            Crea tu cuenta para empezar a reservar tu menú diario.
        </p>
        <div th:if="${error}" class="alerta-error" th:text="${error}"></div>
        <form th:action="@{/registro}" method="post" id="formRegistro">
            <div class="form-grupo">
                <label for="nombre" class="form-label">Nombre completo</label>
                <input type="text" id="nombre" name="nombre" class="form-input" required autofocus>
            </div>
            <div class="form-grupo">
                <label for="email" class="form-label">Email</label>
                <input type="email" id="email" name="email" class="form-input" required>
            </div>
            <div class="form-grupo">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" class="form-input" required>
            </div>
            <div class="form-grupo">
                <label for="contrasena2" class="form-label">Repetir contraseña</label>
                <input type="password" id="contrasena2" class="form-input" required>
            </div>
            <button type="submit" class="w-full btn-primary">Registrarse</button>
        </form>
        <div class="mt-6 text-center">
            <span class="text-sm text-gray-500">¿Ya tienes cuenta?</span>
            <a th:href="@{/login}" class="btn-ghost ml-1">Inicia sesión</a>
        </div>
    </div>
    <script>
        document.getElementById('formRegistro').addEventListener('submit', function(e) {
            const pwd = document.getElementById('contrasena').value;
            const pwd2 = document.getElementById('contrasena2').value;
            if (pwd !== pwd2) {
                e.preventDefault();
                alert('Las contraseñas no coinciden.');
            }
        });
    </script>
</body>
</html>
