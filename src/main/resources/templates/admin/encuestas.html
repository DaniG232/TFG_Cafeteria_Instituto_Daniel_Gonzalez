<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Encuestas - Panel de Administración</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina">
    <nav class="nav">
        <div class="nav-contenido">
            <div class="flex items-center gap-3">
                <a th:href="@{/}" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img th:src="@{/imagenes/logo.png}" alt="La Pausa"
                        style="width:48px; height:48px; margin-left: 10px"
                        class="object-contain" />
                    <span class="font-bold text-gray-900 text-lg">
                        La Pausa
                    </span>
                </a>
                <span class="text-gray-300">|</span>
                <span class="nav-enlace-activo">Encuestas</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a th:href="@{/admin/inicio}" class="nav-enlace">Inicio</a>
                <a th:href="@{/admin/usuarios}" class="nav-enlace">Usuarios</a>
                <a th:href="@{/admin/menus}" class="nav-enlace">Menús</a>
                <a th:href="@{/admin/reservas}" class="nav-enlace">Reservas</a>
                <a th:href="@{/admin/encuestas}" class="nav-enlace-activo">Encuestas</a>
                <a th:href="@{/admin/avisos}" class="nav-enlace">Avisos</a>
            </div>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/notificaciones :: panel}"></div>
                <span class="nav-saludo">¡Hola, <span class="nav-usuario" th:text="${nombreUsuario}">Admin</span>!</span>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="btn-secondary btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="contenido-principal">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="titulo-seccion">Gestión de Encuestas</h2>
                <p class="subtitulo-seccion">Crea encuestas para evaluar el servicio de cafetería.</p>
            </div>
            <a th:href="@{/admin/encuestas/nueva}" class="btn-primary">Crear Nueva Encuesta</a>
        </div>

        <div th:if="${exito}" class="alerta-exito" th:text="${exito}"></div>

        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Título</th>
                        <th>Fecha Creación</th>
                        <th>Preguntas</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="encuesta : ${encuestas}">
                        <td th:text="${encuesta.idEncuesta}"></td>
                        <td class="font-medium" th:text="${encuesta.titulo}"></td>
                        <td th:text="${encuesta.fechaCreacion}"></td>
                        <td th:text="${encuesta.preguntas.size()}"></td>
                        <td>
                            <div class="flex gap-2">
                                <a th:href="@{/admin/encuestas/{id}/respuestas(id=${encuesta.idEncuesta})}" class="btn-secondary btn-sm">Ver Respuestas</a>
                                <form th:action="@{/admin/encuestas/{id}/eliminar(id=${encuesta.idEncuesta})}" method="post" class="inline">
                                    <button type="submit" class="btn-danger btn-sm" onclick="return confirm('¿Eliminar esta encuesta definitivamente?');">Eliminar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
</body>
</html>
