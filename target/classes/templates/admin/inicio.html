<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Inicio - Panel de Administración</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="pagina">
    <nav class="nav">
        <div class="nav-contenido">
            <div class="flex items-center gap-3">
                <a th:href="@{/}" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img th:src="@{/imagenes/logo.png}" alt="La Pausa"
                        style="width:48px; height:48px; margin-left: 10px"
                        class="object-contain" />
                    <span class="font-bold text-gray-900 text-lg">
                        La Pausa
                    </span>
                </a>
                <span class="text-gray-300">|</span>
                <span class="nav-enlace-activo">Inicio</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a th:href="@{/admin/inicio}" class="nav-enlace-activo">Inicio</a>
                <a th:href="@{/admin/usuarios}" class="nav-enlace">Usuarios</a>
                <a th:href="@{/admin/menus}" class="nav-enlace">Menús</a>
                <a th:href="@{/admin/reservas}" class="nav-enlace">Reservas</a>
                <a th:href="@{/admin/encuestas}" class="nav-enlace">Encuestas</a>
                <a th:href="@{/admin/avisos}" class="nav-enlace">Avisos</a>
            </div>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/notificaciones :: panel}"></div>
                <span class="nav-saludo">¡Hola, <span class="nav-usuario"
                        th:text="${nombreUsuario}">Admin</span>!</span>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="btn-secondary btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>
    <main class="contenido-principal">
        <h2 class="titulo-seccion">Bienvenido/a al Panel de Administración</h2>
        <p class="subtitulo-seccion">Gestiona la cafetería del instituto.</p>
        <div class="grid-stats">
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="stat-numero" th:text="${platosActivos}">0</div>
                        <h3 class="stat-etiqueta">Platos Activos</h3>
                    </div>
                    <div class="stat-icono">🍽️</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="stat-numero" th:text="${menusTotales}">0</div>
                        <h3 class="stat-etiqueta">Menús Totales</h3>
                    </div>
                    <div class="stat-icono">📋</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="stat-numero" th:text="${profesoresTotales}">0</div>
                        <h3 class="stat-etiqueta">Profesores Registrados</h3>
                    </div>
                    <div class="stat-icono">👩‍🏫</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="flex items-center justify-between">
                    <div>
                        <div class="stat-numero" th:text="${reservasHoy}">0</div>
                        <h3 class="stat-etiqueta">Reservas para Hoy</h3>
                    </div>
                    <div class="stat-icono">📅</div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
</body>

</html>
