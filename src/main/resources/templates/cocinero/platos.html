<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Platos - Cocina</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina">
    <nav class="nav">
        <div class="nav-contenido">
            <div class="flex items-center gap-3">
                <a th:href="@{/}" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img th:src="@{/imagenes/logo.png}" alt="La Pausa"
                        style="width:48px; height:48px; margin-left: 10px"
                        class="object-contain" />
                    <span class="font-bold text-gray-900 text-lg">
                        La Pausa
                    </span>
                </a>
                <span class="text-gray-300">|</span>
                <span class="nav-enlace-activo">Platos</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a th:href="@{/cocinero/inicio}" class="nav-enlace">Inicio</a>
                <a th:href="@{/cocinero/platos}" class="nav-enlace-activo">Platos</a>
                <a th:href="@{/cocinero/menus}" class="nav-enlace">Menús</a>
                <a th:href="@{/cocinero/reservas}" class="nav-enlace">Reservas</a>
                <a th:href="@{/cocinero/encuestas}" class="nav-enlace">Encuestas</a>
            </div>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/notificaciones :: panel}"></div>
                <span class="nav-saludo">¡Hola, <span class="nav-usuario" th:text="${nombreUsuario}">Cocinero</span>!</span>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="btn-secondary btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="contenido-principal">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="titulo-seccion">Gestión de Platos</h2>
                <p class="subtitulo-seccion">Crea y administra los platos disponibles para los menús.</p>
            </div>
            <a th:href="@{/cocinero/platos/nuevo}" class="btn-primary">Nuevo Plato</a>
        </div>

        <div th:if="${exito}" class="alerta-exito" th:text="${exito}"></div>

        <div class="tabla-contenedor">
            <table class="tabla">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Precio Base</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="plato : ${platos}">
                        <td class="font-medium" th:text="${plato.nombre}"></td>
                        <td><span class="badge-azul" th:text="${plato.tipo}"></span></td>
                        <td th:text="${plato.precio + ' €'}"></td>
                        <td>
                            <span th:if="${plato.activo}" class="badge-verde">Activo</span>
                            <span th:unless="${plato.activo}" class="badge-gris">Inactivo</span>
                        </td>
                        <td>
                            <div class="flex gap-2">
                                <a th:href="@{/cocinero/platos/{id}/editar(id=${plato.idPlato})}" class="btn-secondary btn-sm">Editar</a>
                                <form th:action="@{/cocinero/platos/{id}/eliminar(id=${plato.idPlato})}" method="post" class="inline">
                                    <button type="submit" class="btn-danger btn-sm" onclick="return confirm('¿Desactivar este plato?');" th:disabled="${!plato.activo}">Desactivar</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
</body>
</html>
