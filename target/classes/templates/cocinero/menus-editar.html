<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Editar Menú - Cocina</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina">
    <nav class="nav">
        <div class="nav-contenido">
            <div class="flex items-center gap-3">
                <a th:href="@{/}" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img th:src="@{/imagenes/logo.png}" alt="La Pausa"
                        style="width:48px; height:48px; margin-left: 10px"
                        class="object-contain" />
                    <span class="font-bold text-gray-900 text-lg">
                        La Pausa
                    </span>
                </a>
                <span class="text-gray-300">|</span>
                <span class="nav-enlace-activo">Menús</span>
            </div>
            <div class="hidden md:flex space-x-6">
                <a th:href="@{/cocinero/inicio}" class="nav-enlace">Inicio</a>
                <a th:href="@{/cocinero/platos}" class="nav-enlace">Platos</a>
                <a th:href="@{/cocinero/menus}" class="nav-enlace-activo">Menús</a>
                <a th:href="@{/cocinero/reservas}" class="nav-enlace">Reservas</a>
                <a th:href="@{/cocinero/encuestas}" class="nav-enlace">Encuestas</a>
            </div>
            <div class="flex items-center space-x-4">
                <div th:replace="~{fragments/notificaciones :: panel}"></div>
                <span class="nav-saludo">¡Hola, <span class="nav-usuario" th:text="${nombreUsuario}">Cocinero</span>!</span>
                <form th:action="@{/logout}" method="post" class="inline">
                    <button type="submit" class="btn-secondary btn-sm">Cerrar sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="contenido-principal">
        <div class="max-w-xl mx-auto">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-titulo">Editar Menú</h2>
                </div>

                <div class="card-cuerpo">
                    <form th:action="@{/cocinero/menus/{id}/editar(id=${menu.idMenu})}" method="post">
                        <div class="form-grupo">
                            <label for="fecha" class="form-label">Fecha del Menú</label>
                            <input type="date" id="fecha" name="fecha" th:value="${menu.fecha}" class="form-input" required>
                        </div>
                        
                        <div class="form-grupo">
                            <label for="primerPlato" class="form-label">Primer Plato</label>
                            <select id="primerPlato" name="primerPlato" class="form-input" required>
                                <option th:each="p : ${primeros}" th:value="${p.idPlato}" th:text="${p.nombre}" th:selected="${p.idPlato == menu.primerPlato.idPlato}"></option>
                            </select>
                        </div>
                        
                        <div class="form-grupo">
                            <label for="segundoPlato" class="form-label">Segundo Plato</label>
                            <select id="segundoPlato" name="segundoPlato" class="form-input" required>
                                <option th:each="p : ${segundos}" th:value="${p.idPlato}" th:text="${p.nombre}" th:selected="${p.idPlato == menu.segundoPlato.idPlato}"></option>
                            </select>
                        </div>
                        
                        <div class="form-grupo">
                            <label for="postre" class="form-label">Postre</label>
                            <select id="postre" name="postre" class="form-input" required>
                                <option th:each="p : ${postres}" th:value="${p.idPlato}" th:text="${p.nombre}" th:selected="${p.idPlato == menu.postre.idPlato}"></option>
                            </select>
                        </div>
                        
                        <div class="form-grupo">
                            <label for="bebida" class="form-label">Bebida</label>
                            <select id="bebida" name="bebida" class="form-input" required>
                                <option th:each="p : ${bebidas}" th:value="${p.idPlato}" th:text="${p.nombre}" th:selected="${p.idPlato == menu.bebida.idPlato}"></option>
                            </select>
                        </div>

                        <div class="form-grupo">
                            <label for="precio" class="form-label">Precio (€)</label>
                            <input type="number" step="0.01" min="0" id="precio" name="precio" th:value="${menu.precio}" class="form-input" required>
                        </div>
                        
                        <div class="flex space-x-3 mt-8 border-t border-gray-200 pt-6">
                            <button type="submit" class="btn-primary">Actualizar Menú</button>
                            <a th:href="@{/cocinero/menus}" class="btn-secondary">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
</body>
</html>
