<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Enviar Avisos - Admin</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="pagina">
    <nav class="nav">
        <div class="nav-contenido">
            <div class="flex items-center gap-3">
                <a th:href="@{/}" class="flex items-center gap-4 hover:opacity-80 transition-opacity">
                    <img th:src="@{/imagenes/logo.png}" alt="La Pausa"
                        style="width:48px; height:48px; margin-left: 10px"
                        class="object-contain" />
                    <span class="font-bold text-gray-900 text-lg">
                        La Pausa
                </span>
            </a>
            <span class="text-gray-300">|</span>
            <span class="nav-enlace-activo">Avisos</span>
        </div>
        <div class="hidden md:flex space-x-6">
            <a th:href="@{/admin/inicio}" class="nav-enlace">Inicio</a>
            <a th:href="@{/admin/usuarios}" class="nav-enlace">Usuarios</a>
            <a th:href="@{/admin/menus}" class="nav-enlace">Menús</a>
            <a th:href="@{/admin/reservas}" class="nav-enlace">Reservas</a>
            <a th:href="@{/admin/encuestas}" class="nav-enlace">Encuestas</a>
            <a th:href="@{/admin/avisos}" class="nav-enlace">Avisos</a>
        </div>

        <div class="flex items-center space-x-4">
            <div th:replace="~{fragments/notificaciones :: panel}"></div>

            <span class="text-sm text-gray-600">¡Hola, <span class="font-semibold text-gray-900" th:text="${nombreUsuario}">Admin</span>!</span>
            <form th:action="@{/logout}" method="post" class="inline">
                <button type="submit" class="btn-secondary btn-sm">Cerrar sesión</button>
            </form>
            </div>
        </div>
    </nav>

    <main class="contenido-principal">
        <h2 class="titulo-seccion">Enviar Aviso General</h2>
        <p class="subtitulo-seccion">Este aviso llegará como notificación a todos los profesores.</p>
            
            <div class="p-8">
                <div th:if="${exito}" class="mb-6 p-4 bg-green-50 border border-green-200 text-green-700 rounded-xl text-sm">
                    <span th:text="${exito}">Aviso enviado correctamente.</span>
                </div>

                <form th:action="@{/admin/avisos}" method="post" class="space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Título del aviso</label>
                        <input type="text" name="titulo" required
                               class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#0F766E] focus:border-transparent outline-none transition-all"
                               placeholder="Ej: Cambio de horario, Nueva oferta...">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Mensaje</label>
                        <textarea name="mensaje" rows="4" required
                                  class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:ring-2 focus:ring-[#0F766E] focus:border-transparent outline-none transition-all"
                                  placeholder="Escribe aquí el contenido del aviso..."></textarea>
                    </div>
                    <div class="pt-4">
                        <button type="submit" 
                                class="w-full bg-[#0F766E] hover:bg-[#0D6B63] text-white font-semibold py-3 rounded-xl transition-all shadow-lg shadow-teal-100">
                            Enviar aviso a todos los profesores
                        </button>
                    </div>
                </form>
            </div>
    </main>

    <div th:replace="~{fragments/notificaciones :: scripts}"></div>
</body>
</html>
